# Composite setup shared by every workflow job that needs the toolchain.
# Sets up pnpm and Node.js, restores the pnpm store cache (keyed on
# pnpm-lock.yaml by setup-node) and installs dependencies with a frozen
# lockfile. `vp` and the dev bins land in node_modules/.bin; later steps reach
# them through `pnpm exec vp …`. Nothing is written to GITHUB_PATH, so a step
# cannot redirect a later step's binaries (zizmor's `github-env` audit).
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repository on disk first).
name: Setup
description: Install pnpm, Node.js and the workspace dependencies.

runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@v6.0.9 # zizmor: ignore[unpinned-uses] pinned by .github/workflows/actions.lock, verified in CI by `gh actions-lock --verify`; zizmor cannot yet read the lock for composite actions (gh-actions-lock#183)
    - name: Install Node.js
      uses: actions/setup-node@v6.4.0 # zizmor: ignore[unpinned-uses] pinned by .github/workflows/actions.lock, verified in CI by `gh actions-lock --verify`; zizmor cannot yet read the lock for composite actions (gh-actions-lock#183)
      # Never `latest`: setup-node resolves it to the first entry of the
      # nodejs.org index, pre-releases included (v27.0.0-alpha since
      # 2026-10-29, which hangs some test suites and would publish on an
      # alpha). `*` with `check-latest` reads setup-node's stable manifest
      # instead: the newest released Node.
      with:
        node-version: "*"
        check-latest: true
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
