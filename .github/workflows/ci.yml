name: CI

# One command: `vp run ci` (the `ci` task in vite.config.ts) is the whole gate,
# so CI runs exactly what a contributor runs.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  ci:
    name: CI (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The published packages must work on both.
        node: [lts, latest]
        include:
          - node: lts
            node-version: lts
          # setup-vp's `latest` can resolve to a pre-release; `*` cannot.
          - node: latest
            node-version: "*"
    env:
      # Inherited by every child process, each vitest fork included.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: true
      # Vite+ has no remote task cache: the prefix restores the newest entry
      # and Vite+ re-validates each task's inputs.
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v2-${{ runner.os }}-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v2-${{ runner.os }}-${{ matrix.node }}-
      - name: CI
        run: vp run ci

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only to run the devcontainers CLI on the runner.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: false
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder .
      - name: Check the toolchain inside it
        run: vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc 'vp --version && test -x node_modules/.bin/vp'
