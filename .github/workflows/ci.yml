name: CI

# ONE job, ONE check: the pipeline's task graph lives in vite.config.ts
# (`check`, `build`, `test:unit`), not in GitHub Actions `needs:`. Nothing here
# needs a secret, a database or a credential, so every pull request,
# Dependabot's included, runs the whole gate with a read-only token.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      # Format + lint, type-aware through oxlint-tsgolint (lint.options in
      # vite.config.ts), before anything is built: type resolution reads
      # `src/` through the workspace `exports`, never `dist/`.
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gate
        run: pnpm exec vp run check
      - name: Unit tests
        run: pnpm exec vp run -r test:unit
      - name: Build
        run: pnpm exec vp run -r build
      - name: Audit
        run: pnpm audit --audit-level high
