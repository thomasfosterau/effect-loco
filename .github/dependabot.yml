# Dependabot version updates.
#
# A group exists only where its members must move at the same time (one
# release train, or a hard compatibility table); everything else, each
# GitHub Action included, updates on its own PR. Groups are matched in order
# and the FIRST match wins, so `exclude-patterns` keep `@effect/tsgo` out of
# `effect`. Each group takes every update type (major included), because a
# PR that moves one member alone goes red:
#
# - `toolchain`: vite-plus pins `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` to exact versions, `vite` is its aliased core and
#   `@vitest/coverage-istanbul` must equal its vitest; `effect-tsgo patch`
#   (the `prepare` step) matches the native `tsc` (`@typescript/native`),
#   `oxlint` and `oxlint-tsgolint` by gitHead and hard-errors on any pairing it
#   has no artifact for; `typescript` is the TS6 alias beside it. Read the
#   catalog comments in pnpm-workspace.yaml before merging one. The Effect
#   oxlint plugin (`@enfect/oxlint`) is not in it: it ranges `@oxlint/plugins`
#   `^1.85.0`, so no oxlint pins it.
# - `effect`: the lockstep-versioned Effect release line (`effect`,
#   `@effect/platform-node`, `@effect/vitest`), minus `@effect/tsgo`
#   (toolchain) and `@effect/language-service` (its own version line).
#
# Hand moves Dependabot cannot make (do them on the matching PR's branch):
# - `vite` is an npm alias (`npm:@voidzero-dev/vite-plus-core@<v>`) and must
#   name the same version as `vite-plus`; Dependabot cannot rewrite aliases.
#   Likewise `typescript` (`npm:@typescript/typescript6@<v>`) and
#   `@typescript/native` (`npm:typescript@<v>`), which must match a release in
#   `@effect/tsgo`'s `components` table.
# - `vitest` / `@vitest/coverage-istanbul` must equal vite-plus's exact vitest
#   pin, and `@effect/tsgo` must support vite-plus's oxlint / tsgolint: when
#   the toolchain PR goes red at `pnpm install`, pick the pairing by hand.
# - `@effect/platform-node-shared` is transitive (through
#   `@effect/platform-node`), so it moves when the `effect` group does.
# - The `overrides` (`effect`, `vite@*`, `vitest@*`) follow their catalog
#   entries; `catalogs.peers` ranges are by hand, with a changeset.
#
# `cooldown`: pnpm-workspace.yaml's `minimumReleaseAge` is 480 minutes
# (8 hours). Dependabot's cooldown only takes whole days, so it is 1 day,
# which is longer than pnpm's hold: a Dependabot PR never proposes a version
# pnpm would still refuse to install. Same first-party exemption.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vite / vitest / oxlint; the tsgo patch pairs with them.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
        update-types: ["major", "minor", "patch"]
      # One release train: every Effect runtime package at one version.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    # No groups: each action updates on its own PR.
    cooldown:
      default-days: 1
  # The Dev Container features in .devcontainer/devcontainer.json. No group:
  # each feature updates on its own PR. The image tag is a hand move (it
  # follows the catalog's `vite-plus` pin; see the comment beside it).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
