# `uvx zizmor --offline .github` should report nothing beyond what is configured here.
rules:
  # pnpm's `minimumReleaseAge` is 8 hours; Dependabot's smallest cooldown above it is 1 day.
  dependabot-cooldown:
    config:
      days: 1
  # `uses:` pins exact release tags; .github/workflows/actions.lock pins their commits.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
