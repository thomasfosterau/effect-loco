packages:
  - packages/*

# Every external version lives here (`catalogMode: strict`). After editing it,
# run `pnpm install` and commit pnpm-lock.yaml.
catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.5
  "@effect/platform-node": 4.1.2
  # Moves with `@typescript/native` and vite-plus's oxlint: read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs first.
  "@effect/tsgo": 0.63.0
  "@effect/vitest": 4.1.2
  "@enfect/oxlint": ^0.10.0
  "@types/node": ^26.6.6
  # Must equal vite-plus's vitest.
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.1.2
  fallow: 3.41.0
  # TS6 for JS-API consumers (the language service, `vp pack`'s declarations);
  # TS7 (`@typescript/native`, bin `tsc`) type-checks and must match @effect/tsgo.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` follow vite-plus: move them by hand with it.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Published peer ranges. `effect` is `^4.0.0` unless a package's own
# dependency needs more; raising a floor is a breaking change.
catalogs:
  peers:
    effect: ^4.0.0
  # The CLI: `@effect/platform-node-shared` (via `@effect/platform-node`)
  # requires `effect ^4.1.2`.
  platform-node-peers:
    effect: ^4.1.2

# Don't keep the `minimumReleaseAgeExclude` entries `vp migrate` adds.
overrides:
  # `effect` must be a singleton: two copies break Context / Schema identity.
  effect: "catalog:"
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# `fallow` fetches its native binary in a postinstall step.
onlyBuiltDependencies:
  - fallow

minimumReleaseAge: 480
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
